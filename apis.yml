name: Maza
description: Maza was an Andreessen Horowitz (a16z) backed consumer fintech startup that helped Spanish-speaking
  and undocumented immigrants in the United States access the financial system - guiding users through
  applying for an ITIN (Individual Taxpayer Identification Number), opening a bank account, and obtaining
  financial services without a Social Security number. Founded in 2022, Maza raised an $8M seed round
  led by a16z in June 2023 and grew to more than 50,000 users. In April 2025 Maza was acquired by Flex
  for a reported $40M. Maza operated a consumer mobile application only and never published a public developer
  API, SDK, or event surface; following the acquisition its domains (maza.io, joinmaza.com, maza.us) now
  resolve to parked landing pages.
